name: Android Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Signaturschlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            keystore="$RUNNER_TEMP/workout-release.p12"
            # Beim Einfügen ins Secret entstandene Leerzeichen/Zeilenumbrüche entfernen und
            # fehlende „=“-Füllzeichen am Ende ergänzen (werden beim Markieren oft nicht mitkopiert).
            cleaned="$(printf '%s' "$KEYSTORE_BASE64" | tr -d ' \t\r\n')"
            while [ $(( ${#cleaned} % 4 )) -ne 0 ]; do cleaned="$cleaned="; done
            if ! printf '%s' "$cleaned" | base64 -d > "$keystore"; then
              # Diagnose ohne den Inhalt preiszugeben: Länge, Prüfsumme und Zahl ungültiger Zeichen.
              echo "Länge nach Bereinigung: ${#cleaned} Zeichen"
              echo "SHA-256: $(printf '%s' "$cleaned" | sha256sum | cut -c1-16)…"
              echo "Ungültige Zeichen: $(printf '%s' "$cleaned" | tr -d 'A-Za-z0-9+/=' | wc -c)"
              echo "::error::SIGNING_KEYSTORE_BASE64 ist kein gültiges Base64. Bitte den Wert aus SIGNING_KEYSTORE_BASE64.txt vollständig neu eintragen."
              exit 1
            fi
            if ! keytool -list -keystore "$keystore" -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" -alias workout > /dev/null; then
              echo "::error::Keystore lässt sich nicht öffnen – Base64-Wert unvollständig oder SIGNING_KEYSTORE_PASSWORD falsch."
              exit 1
            fi
            echo "SIGNING_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"
            echo "APK wird mit dem festen Schlüssel signiert."
          else
            echo "::warning::Secret SIGNING_KEYSTORE_BASE64 fehlt – APK wird mit wechselndem Debug-Schlüssel signiert und lässt sich nicht als Update installieren."
          fi

      - name: Tests und APK bauen
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: WorkoutBegleiter-apk
          path: app/build/outputs/apk/debug/app-debug.apk
